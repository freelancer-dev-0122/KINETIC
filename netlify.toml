[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback redirect to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers: long-lived immutable for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers: no-cache for HTML to ensure instant updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
