<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark carbon background -->
  <rect width="64" height="64" fill="#0E0E10" rx="4"/>
  <!-- Sharp race border -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#2B3FFF" stroke-width="2.5" rx="3"/>
  <!-- High-octane kinetic slash / K symbol in Volt & Cream -->
  <!-- K Stem in Kinetic Volt -->
  <polygon points="14,12 24,12 24,52 14,52" fill="#D6FF3A"/>
  <!-- Upper diagonal in Cream -->
  <polygon points="26,30 40,12 52,12 35,33" fill="#F4F1EA"/>
  <!-- Lower diagonal in Kinetic Pulse Red -->
  <polygon points="34,31 52,52 40,52 26,35" fill="#E63B2E"/>
  <!-- Speed notch -->
  <polygon points="46,6 54,6 50,12 42,12" fill="#D6FF3A"/>
</svg>
